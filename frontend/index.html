<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0908" />
    <meta
      name="description"
      content="ProofPay — an AI trust layer for payments. Money moves when the promise is proven."
    />
    <link rel="icon" href="/seal.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://proofpay-cknb.onrender.com/" />

    <!-- So a pasted link renders as something rather than as a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://proofpay-cknb.onrender.com/" />
    <meta property="og:title" content="ProofPay — Money moves when the promise is proven" />
    <meta
      property="og:description"
      content="An AI trust layer for payments. A promise written in plain language becomes conditions that can be proven, and money is released only when they are."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>ProofPay — Money moves when the promise is proven</title>
    <script>
      /**
       * Paint the right theme on the very first frame.
       *
       * React cannot do this: by the time it mounts, the browser has already
       * painted, and a dark app that flashes white for 200ms on every load looks
       * broken. So the stored preference is read and stamped here, before the
       * stylesheet is applied. ThemeContext writes the same attribute afterwards
       * and agrees with it — this is the only copy of the logic that has to run
       * synchronously, and it deliberately never throws.
       */
      (function () {
        try {
          var saved = localStorage.getItem('proofpay.theme');
          var preference = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
          var resolved =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          document.documentElement.dataset.theme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', resolved === 'dark' ? '#0A0908' : '#F5F1E8');
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
