# Render blueprint — one service that serves both halves of ProofPay.
#
# The API and the interface share an origin deliberately. The browser client
# calls `/api` as a relative path and the session is a `sameSite: 'lax'` cookie:
# split them across two hosts and the cookie stops being sent, so every request
# arrives signed out. `createApp()` serves `frontend/dist` when it exists, which
# is what the build command below produces.
#
# Deploy: push this file, then Render → New → Blueprint → pick the repo.
# The secrets marked `sync: false` are typed into the dashboard, never here.
#
# Live at https://proofpay-otbd.onrender.com — Render appends its own suffix to
# make the hostname unique, so the URL is not `name` verbatim. Renaming the
# service here would create a second one rather than move this URL.
#
# That service was created from the dashboard rather than from this file, so it
# does not track these settings — which is why NODE_ENV had to be set by hand
# there. A Blueprint deploy from this file would not need any of that.

services:
  - type: web
    name: proofpay
    runtime: node
    plan: free
    region: singapore # the closest region to India that Render offers
    branch: main

    # The backend installs without dev dependencies on purpose: mongodb-memory-server
    # is only ever used by the tests and the local fallback, and pulling it here
    # would download a mongod binary into a production image that never runs one.
    # The frontend keeps its dev dependencies, because Vite and Tailwind *are* the build.
    buildCommand: npm install --prefix backend --omit=dev && npm install --prefix frontend && npm run build
    startCommand: npm start

    # Render restarts the service if this stops answering. It is the same endpoint
    # that reports the live Proof Engine and payment mode.
    healthCheckPath: /api/health

    # ─────────────────────────────────────────────────────────────────────────
    # Uploaded evidence needs no disk.
    #
    # It used to. The filesystem here is ephemeral — every redeploy and every
    # wake from the 15-minute idle sleep starts with an empty `backend/uploads`
    # — so proof filed in the morning was gone by the afternoon while its
    # Evidence record, verdict and explanation all survived in MongoDB and went
    # on describing a file that no longer existed.
    #
    # Uploads are now stored in MongoDB beside the record that owns them (see
    # models/StoredFile.js), capped at MAX_UPLOAD_MB and served from
    # /api/files/:token. They survive redeploys, restarts and idle sleep on the
    # free plan, and a persistent disk is no longer something this needs.
    # ─────────────────────────────────────────────────────────────────────────

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: 22

      # Generated once by Render and kept. Boot refuses anything under 32
      # characters in production rather than silently weakening every session.
      - key: JWT_SECRET
        generateValue: true

      # Atlas connection string. Set in the dashboard — it carries a password.
      # Atlas must allow 0.0.0.0/0: a free Render service has no static outbound
      # IP, so an allowlist of specific addresses will refuse it after a restart.
      - key: MONGODB_URI
        sync: false

      # Production refuses the ephemeral in-memory database outright, so this is
      # only ever a statement of intent — the URI above has to be real.
      - key: ALLOW_MEMORY_DB
        value: false

      # The Proof Engine. Leave all three unset to run the deterministic engine,
      # which is a real fallback rather than a stub.
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false

      - key: PAYMENT_MODE
        value: demo

      # Email leaves over HTTPS, not SMTP: a free instance cannot open 25, 465
      # or 587, so nodemailer hangs there until it times out and the message is
      # lost without an error. MAIL_FROM must be the sender address verified in
      # Brevo. Leave both unset and mail is written to the log instead.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # Google sign-in. Both are set in the dashboard, or neither — with one
      # missing the app does not offer the button, which is a working state.
      #
      # GOOGLE_CALLBACK_URL is deliberately absent for the same reason
      # CLIENT_URL is: env.js derives it from RENDER_EXTERNAL_URL, giving
      # https://proofpay-otbd.onrender.com/api/auth/google/callback. That exact
      # string has to be registered in the Google Cloud Console as an authorised
      # redirect URI, or Google refuses the sign-in with redirect_uri_mismatch.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # CLIENT_URL is deliberately absent: env.js falls back to Render's own
      # RENDER_EXTERNAL_URL — https://proofpay-otbd.onrender.com for this
      # service — so it does not need to know its address before it has one.
      # Set it explicitly once a custom domain exists.
